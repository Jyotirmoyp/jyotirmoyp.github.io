<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raga Web — a network map of Hindustani classical music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div class="canvas-wrap" id="canvasWrap">
    <div class="topbar">
      <div class="brand">
        <h1>Raga Web</h1>
        <p>click a circle to open it &mdash; names appear only once you expand into them</p>
        <div class="legend">
          <span><span class="dot" style="background:#c99a44"></span>genre</span>
          <span><span class="dot" style="background:#7f77dd"></span>gharana / bani / instrument</span>
          <span><span class="dot" style="background:#5dcaa5"></span>musician</span>
          <span><span class="swatch"></span>structure</span>
          <span><span class="swatch rel"></span>relationship</span>
        </div>
      </div>
      <div class="toolbar">
        <button id="expandAllBtn">Expand all</button>
        <button id="collapseAllBtn">Collapse all</button>
        <button id="resetBtn">Reset view</button>
      </div>
    </div>
    <svg id="net"></svg>
  </div>
  <div class="panel-scrim" id="panelScrim"></div>
  <div class="panel" id="panel">
    <button class="panel-close" id="panelCloseBtn" aria-label="Close">&times;</button>
    <div id="panelBody"></div>
  </div>
</div>

<!-- Everything is wired through imports now: main.js pulls in
     data/index.js, graph.js and panel.js itself. This requires
     the page to be served over http(s) — see README.md. -->
<script type="module" src="js/main.js"></script>
</body>
</html>
